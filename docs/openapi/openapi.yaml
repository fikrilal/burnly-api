openapi: 3.0.0
paths:
  /health:
    get:
      description: Indicates whether the process is alive.
      operationId: health.get
      parameters: []
      responses:
        "200":
          description: Liveness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      summary: Liveness check
      tags:
        - Health
      x-error-codes:
        - INTERNAL
  /ready:
    get:
      description: Indicates whether the service is ready to receive traffic.
      operationId: ready.get
      parameters: []
      responses:
        "200":
          description: Readiness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      summary: Readiness check
      tags:
        - Health
      x-error-codes:
        - INTERNAL
  /v1/auth/password/register:
    post:
      description: Creates a user and immediately issues first-party access + refresh
        tokens.
      operationId: auth.password.register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRegisterRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Register (password)
      tags: &a1
        - Auth
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_EMAIL_ALREADY_EXISTS
        - INTERNAL
  /v1/auth/oidc/exchange:
    post:
      description: Verifies an OIDC id_token (e.g., Google) and issues first-party
        access + refresh tokens. Does not auto-link to an existing password
        account purely by email.
      operationId: auth.oidc.exchange
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Exchange OIDC id_token
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_LINK_REQUIRED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/oidc/connect:
    post:
      description: Links an OIDC identity (e.g., Google) to the authenticated user. If
        the OIDC email matches the user email, the user email is marked
        verified.
      operationId: auth.oidc.connect
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcConnectRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Connect OIDC identity (current user)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_IDENTITY_ALREADY_LINKED
        - AUTH_OIDC_PROVIDER_ALREADY_LINKED
        - INTERNAL
  /v1/auth/email/verify:
    post:
      description: Verifies a user email using a token sent via email.
      operationId: auth.email.verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDto"
      responses:
        "204":
          description: ""
      summary: Verify email
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_EMAIL_VERIFICATION_TOKEN_INVALID
        - AUTH_EMAIL_VERIFICATION_TOKEN_EXPIRED
        - INTERNAL
  /v1/auth/email/verification/resend:
    post:
      description: Enqueues a new verification email for the authenticated user (rate
        limited).
      operationId: auth.email.verification.resend
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Resend verification email (current user)
      tags: *a1
      x-error-codes:
        - UNAUTHORIZED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/reset/request:
    post:
      description: Enqueues a password reset email for an existing user. Returns 204
        even if the email is unknown to avoid account enumeration.
      operationId: auth.password.reset.request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDto"
      responses:
        "204":
          description: ""
      summary: Request password reset
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/reset/confirm:
    post:
      description: Resets the user password using a one-time token and revokes all sessions.
      operationId: auth.password.reset.confirm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequestDto"
      responses:
        "204":
          description: ""
      summary: Confirm password reset
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_PASSWORD_RESET_TOKEN_INVALID
        - AUTH_PASSWORD_RESET_TOKEN_EXPIRED
        - INTERNAL
  /v1/auth/password/login:
    post:
      description: Authenticates a user and issues first-party access + refresh tokens.
      operationId: auth.password.login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Login (password)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_USER_SUSPENDED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/change:
    post:
      description: Changes the authenticated user password. Revokes other sessions
        (and their refresh tokens) but keeps the current session active.
      operationId: auth.password.change
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Change password (current user)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - AUTH_PASSWORD_NOT_SET
        - AUTH_CURRENT_PASSWORD_INVALID
        - INTERNAL
  /v1/auth/refresh:
    post:
      description: Rotates the refresh token and returns a new access + refresh token.
      operationId: auth.refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultEnvelopeDto"
      summary: Refresh tokens
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - AUTH_REFRESH_TOKEN_EXPIRED
        - AUTH_REFRESH_TOKEN_REUSED
        - AUTH_SESSION_REVOKED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/logout:
    post:
      description: Revokes the session associated with the provided refresh token.
      operationId: auth.logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequestDto"
      responses:
        "204":
          description: ""
      summary: Logout
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - INTERNAL
  /v1/auth/desktop/handoff:
    post:
      description: Authenticated burnly-web creates a short-lived one-time code after
        browser login. Redirect the browser to redirectUri?code=&state=. Desktop
        exchanges the code via auth.desktop.token. See
        docs/planning/desktop-auth-via-web.md and ADR 0022.
      operationId: auth.desktop.handoff
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopHandoffRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopHandoffEnvelopeDto"
      security:
        - access-token: []
      summary: Create desktop handoff code (web)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - RATE_LIMITED
        - AUTH_DESKTOP_REDIRECT_URI_INVALID
        - AUTH_DESKTOP_HANDOFF_INVALID
        - AUTH_DESKTOP_HANDOFF_UNAVAILABLE
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/desktop/token:
    post:
      description: Desktop exchanges a one-time handoff code + PKCE verifier for
        first-party access + refresh tokens. Mints a new session (separate from
        the browser session).
      operationId: auth.desktop.token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopTokenRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Exchange desktop handoff code
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - AUTH_DESKTOP_HANDOFF_INVALID
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /.well-known/jwks.json:
    get:
      description: Publishes public keys used to verify access tokens.
      operationId: auth.jwks.get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                required:
                  - keys
      summary: JWKS
      tags:
        - Auth
      x-error-codes:
        - INTERNAL
  /v1/me/sessions:
    get:
      description: Lists all sessions (active, revoked, expired) for the authenticated
        user. Revoked sessions have refresh tokens revoked; access tokens remain
        valid until expiry.
      operationId: users.me.sessions.list
      parameters:
        - name: limit
          required: false
          in: query
          description: Max results to return (default 25, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from the previous response meta.nextCursor.
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: 'Comma-separated fields; prefix "-" for descending. Max 3 fields.
            Default: "-createdAt". Allowed: createdAt, id'
          schema:
            type: string
            example: -createdAt
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSessionsListEnvelopeDto"
      security:
        - access-token: []
      summary: List current user sessions
      tags: &a2
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - INTERNAL
  /v1/me/sessions/{sessionId}/revoke:
    post:
      description: Revokes the given session and its refresh tokens. Idempotent.
      operationId: users.me.sessions.revoke
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
            type: string
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Revoke a session (current user)
      tags: *a2
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - NOT_FOUND
        - INTERNAL
  /v1/me/push-token:
    put:
      description: Stores the FCM registration token for the current session.
        Idempotent; replaces any existing token for the session.
      operationId: users.me.pushToken.upsert
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePushTokenUpsertRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Register/update push token (current session)
      tags: &a3
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - AUTH_PUSH_NOT_CONFIGURED
        - INTERNAL
    delete:
      description: Clears the stored push token for the current session. Idempotent.
      operationId: users.me.pushToken.revoke
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Revoke push token (current session)
      tags: *a3
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /v1/me:
    get:
      description: Returns the authenticated user profile.
      operationId: users.me.get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      security:
        - access-token: []
      summary: Get current user
      tags: &a4
        - Users
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
    patch:
      description: Partially updates the authenticated user profile. Omitted fields
        are unchanged; null clears a field.
      operationId: users.me.patch
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      security:
        - access-token: []
      summary: Update current user profile
      tags: *a4
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/me/profile-image/upload:
    post:
      description: Creates an upload record and returns a short-lived presigned URL
        for direct upload to object storage.
      operationId: users.me.profileImage.upload
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileImageUploadRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUploadPlanEnvelopeDto"
      security:
        - access-token: []
      summary: Create a profile image upload plan (presigned URL)
      tags: &a5
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - RATE_LIMITED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/profile-image/complete:
    post:
      description: Verifies the uploaded object and attaches it to the current user profile.
      operationId: users.me.profileImage.complete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileImageUploadRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Finalize a profile image upload
      tags: *a5
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - NOT_FOUND
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - USERS_PROFILE_IMAGE_NOT_UPLOADED
        - USERS_PROFILE_IMAGE_SIZE_MISMATCH
        - USERS_PROFILE_IMAGE_CONTENT_TYPE_MISMATCH
        - INTERNAL
  /v1/me/profile-image:
    delete:
      description: Detaches the current profile image (if any) and marks the stored
        file deleted. Object storage deletion is best-effort.
      operationId: users.me.profileImage.clear
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Clear current profile image
      tags: *a5
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /v1/me/profile-image/url:
    get:
      description: Returns a short-lived presigned URL for rendering the current
        profile image. Returns 204 when no profile image is set.
      operationId: users.me.profileImage.url
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUrlEnvelopeDto"
        "204":
          description: ""
      security:
        - access-token: []
      summary: Get current profile image URL
      tags: *a5
      x-error-codes:
        - UNAUTHORIZED
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/account-deletion/request:
    post:
      description: Schedules account deletion 30 days in the future. The account
        remains usable during the grace period and the request can be canceled.
        After the grace period, the account is de-identified (PII erased) and
        the email becomes reusable.
      operationId: users.me.accountDeletion.request
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Request account deletion (30-day grace)
      tags: &a6
        - Users
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/me/account-deletion/cancel:
    post:
      description: Cancels a previously scheduled account deletion request.
      operationId: users.me.accountDeletion.cancel
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Cancel account deletion
      tags: *a6
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - INTERNAL
  /v1/sync/devices/{clientDeviceId}:
    put:
      description: Upserts this desktop install as a sync device for the authenticated
        user. Safe to call repeatedly.
      operationId: sync.devices.upsert
      parameters:
        - name: clientDeviceId
          required: true
          in: path
          description: Stable per-install client device id (max 128 chars).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSyncDeviceRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDeviceEnvelopeDto"
      security:
        - access-token: []
      summary: Register or update a sync device
      tags: &a7
        - Sync
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - INTERNAL
    get:
      description: Returns this install’s sync device metadata for the authenticated
        user, including lastSyncAt when available.
      operationId: sync.devices.get
      parameters:
        - name: clientDeviceId
          required: true
          in: path
          description: Stable per-install client device id (max 128 chars).
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDeviceEnvelopeDto"
      security:
        - access-token: []
      summary: Get sync device metadata
      tags: *a7
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
  /v1/sync/daily-usage:
    post:
      description: "Uploads a batch of daily usage aggregates for a registered sync
        device. Requires Idempotency-Key. All-or-nothing validation; does not
        create devices. Limits: 1000 facts/request, 100 models/fact, 60
        pushes/15 min per user."
      operationId: sync.dailyUsage.push
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDailyUsageRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDailyUsageEnvelopeDto"
      security:
        - access-token: []
      summary: Push daily usage facts
      tags:
        - Sync
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - RATE_LIMITED
        - SYNC_CONTRACT_UNSUPPORTED
        - SYNC_DEVICE_NOT_FOUND
        - SYNC_IDENTITY_INVALID
        - SYNC_PAYLOAD_TOO_LARGE
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/sync/status:
    get:
      description: Returns registered sync devices for the authenticated user with
        last successful push times. Account lastSyncAt is
        MAX(device.lastSyncAt). Public identity is clientDeviceId (not server
        UUID). This is not a usage totals API.
      operationId: sync.status.get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusEnvelopeDto"
      security:
        - access-token: []
      summary: Sync status and device inventory
      tags:
        - Sync
      x-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - INTERNAL
  /v1/usage/summary:
    get:
      description: Returns user-level parent token totals for today, the last 7
        calendar days (including today), and the current calendar month in the
        given IANA timezone. Sums active DailyUsageFact rows across devices by
        default. Optional deviceId filters to one clientDeviceId. Parent
        totalTokens are authoritative; model children are not used.
      operationId: usage.summary.get
      parameters:
        - name: timezone
          required: true
          in: query
          description: IANA timezone. Defines today/week/month boundaries and filters fact
            aggregationTimezone (exact match).
          schema:
            example: Asia/Jakarta
            type: string
        - name: deviceId
          required: false
          in: query
          description: Optional desktop clientDeviceId filter (not server UUID).
          schema:
            example: dev_abc123
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryEnvelopeDto"
      security:
        - access-token: []
      summary: Usage summary for today / week / month
      tags:
        - Usage
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
  /v1/usage/calendar:
    get:
      description: Returns a dense per-day series of parent totalTokens for the
        inclusive from/to range in the given IANA timezone (exact
        aggregationTimezone match). Empty days are zeros. Sums across devices by
        default; optional deviceId filters to one clientDeviceId. Max range 366
        days inclusive. Does not include model children.
      operationId: usage.calendar.get
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive range start (YYYY-MM-DD). Max 366 days with to.
          schema:
            example: 2026-06-01
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive range end (YYYY-MM-DD). Must be >= from.
          schema:
            example: 2026-07-09
            type: string
        - name: timezone
          required: true
          in: query
          description: IANA timezone; filters fact aggregationTimezone (exact match).
          schema:
            example: Asia/Jakarta
            type: string
        - name: deviceId
          required: false
          in: query
          description: Optional desktop clientDeviceId filter (not server UUID).
          schema:
            example: dev_abc123
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageCalendarEnvelopeDto"
      security:
        - access-token: []
      summary: Usage calendar heatmap series
      tags:
        - Usage
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
  /v1/usage/days/{date}:
    get:
      description: Returns active parent daily facts for a single calendar date with
        model children, day-level parent totals, bySource rollup, and
        modelAttribution unattributed remainder. Empty days return 200 with
        zeros and empty facts (not 404). Parent totalTokens are authoritative;
        never sum models for day totals.
      operationId: usage.days.get
      parameters:
        - name: date
          required: true
          in: path
          description: Calendar date YYYY-MM-DD
          schema:
            example: 2026-07-08
            type: string
        - name: timezone
          required: true
          in: query
          description: IANA timezone; filters fact aggregationTimezone (exact match).
          schema:
            example: Asia/Jakarta
            type: string
        - name: deviceId
          required: false
          in: query
          description: Optional desktop clientDeviceId filter (not server UUID).
          schema:
            example: dev_abc123
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDayEnvelopeDto"
      security:
        - access-token: []
      summary: Usage day drill-down
      tags:
        - Usage
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
  /v1/usage/models:
    get:
      description: Aggregates daily model children by modelIdentityKey for the
        inclusive from/to range. parentTotals.totalTokens is the authoritative
        chart baseline; attribution.unattributedTokens covers remainder when
        children under-sum. Optional deviceId and sourceKey filters. Max range
        366 days. Does not use model sums as period totals.
      operationId: usage.models.list
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive range start (YYYY-MM-DD). Max 366 days with to.
          schema:
            example: 2026-07-01
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive range end (YYYY-MM-DD). Must be >= from.
          schema:
            example: 2026-07-09
            type: string
        - name: timezone
          required: true
          in: query
          description: IANA timezone; filters parent aggregationTimezone (exact match).
          schema:
            example: Asia/Jakarta
            type: string
        - name: deviceId
          required: false
          in: query
          description: Optional desktop clientDeviceId filter (not server UUID).
          schema:
            example: dev_abc123
            type: string
        - name: sourceKey
          required: false
          in: query
          description: Optional product sourceKey filter.
          schema:
            example: claude-code
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageModelsEnvelopeDto"
      security:
        - access-token: []
      summary: Model breakdown over a date range
      tags:
        - Usage
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
info:
  title: Burnly API
  description: Generated API contract (code-first).
  version: 0.1.0
  contact: {}
tags:
  - name: Health
    description: Service health and readiness endpoints.
  - name: Auth
    description: Authentication and session endpoints.
  - name: Users
    description: User profile endpoints.
  - name: Sync
    description: "Desktop collect: device registration and usage push."
  - name: Usage
    description: Authenticated usage read APIs for web reports.
servers:
  - url: /
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: "First-party access token (Authorization: Bearer <token>)"
  schemas:
    PasswordRegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          minLength: 10
        deviceId:
          type: string
          description: Stable per-device identifier (recommended).
        deviceName:
          type: string
          description: Human-friendly device name (optional).
      required:
        - email
        - password
    MeProfileDto:
      type: object
      properties:
        profileImageFileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
          nullable: true
          description: Current profile image stored file ID. Use `GET
            /v1/me/profile-image/url` to get a short-lived URL for rendering.
        displayName:
          type: string
          example: Dante
          nullable: true
        givenName:
          type: string
          example: Dante
          nullable: true
        familyName:
          type: string
          example: Alighieri
          nullable: true
    AccountDeletionDto:
      type: object
      properties:
        requestedAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
        scheduledFor:
          type: string
          example: 2026-02-09T12:34:56.789Z
          format: date-time
      required:
        - requestedAt
        - scheduledFor
    MeDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        email:
          type: string
          example: user@example.com
        emailVerified:
          type: boolean
          example: false
        roles:
          example:
            - USER
          type: array
          items:
            type: string
        authMethods:
          type: array
          example:
            - PASSWORD
          description: Linked authentication methods on this account.
          items:
            type: string
            enum: &a9
              - PASSWORD
              - GOOGLE
        profile:
          $ref: "#/components/schemas/MeProfileDto"
        accountDeletion:
          nullable: true
          description: When set, the account is scheduled for deletion. The request can be
            canceled until scheduledFor.
          type: object
          allOf:
            - $ref: "#/components/schemas/AccountDeletionDto"
      required:
        - id
        - email
        - emailVerified
        - roles
        - authMethods
        - profile
    AuthResultWithMeDto:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/MeDto"
        accessToken:
          type: string
          example: <access-token>
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - user
        - accessToken
        - refreshToken
    AuthResultWithMeEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthResultWithMeDto"
      required:
        - data
    OidcExchangeRequestDto:
      type: object
      properties:
        provider:
          type: string
          enum: &a8
            - GOOGLE
          example: GOOGLE
        idToken:
          type: string
          example: <oidc-id-token>
        deviceId:
          type: string
          description: Stable per-device identifier (recommended).
        deviceName:
          type: string
          description: Human-friendly device name (optional).
      required:
        - provider
        - idToken
    OidcConnectRequestDto:
      type: object
      properties:
        provider:
          type: string
          enum: *a8
          example: GOOGLE
        idToken:
          type: string
          example: <oidc-id-token>
      required:
        - provider
        - idToken
    VerifyEmailRequestDto:
      type: object
      properties:
        token:
          type: string
          example: <verification-token>
      required:
        - token
    PasswordResetRequestDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
      required:
        - email
    PasswordResetConfirmRequestDto:
      type: object
      properties:
        token:
          type: string
          example: <password-reset-token>
        newPassword:
          type: string
          minLength: 10
      required:
        - token
        - newPassword
    PasswordLoginRequestDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          minLength: 1
        deviceId:
          type: string
          description: Stable per-device identifier (recommended).
        deviceName:
          type: string
          description: Human-friendly device name (optional).
      required:
        - email
        - password
    ChangePasswordRequestDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 10
      required:
        - currentPassword
        - newPassword
    RefreshRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - refreshToken
    AuthUserDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        email:
          type: string
          example: user@example.com
        emailVerified:
          type: boolean
          example: false
        authMethods:
          type: array
          example:
            - PASSWORD
            - GOOGLE
          description: Linked authentication methods on this account. Omitted on token
            refresh responses.
          items:
            type: string
            enum: *a9
      required:
        - id
        - email
        - emailVerified
    AuthResultDto:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUserDto"
        accessToken:
          type: string
          example: <access-token>
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - user
        - accessToken
        - refreshToken
    AuthResultEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthResultDto"
      required:
        - data
    LogoutRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
          example: <refresh-token>
      required:
        - refreshToken
    DesktopHandoffRequestDto:
      type: object
      properties:
        redirectUri:
          type: string
          example: burnly://auth/callback
          description: Must match AUTH_DESKTOP_REDIRECT_URIS allowlist exactly.
        codeChallenge:
          type: string
          description: PKCE S256 code_challenge (base64url(SHA256(code_verifier))).
        codeChallengeMethod:
          type: string
          enum:
            - S256
          example: S256
        state:
          type: string
          description: Opaque CSRF state echoed back to the desktop.
        client:
          type: string
          enum:
            - desktop
          example: desktop
      required:
        - redirectUri
        - codeChallenge
        - codeChallengeMethod
        - state
        - client
    DesktopHandoffDataDto:
      type: object
      properties:
        code:
          type: string
          description: One-time handoff code (send to desktop via redirect).
        expiresIn:
          type: number
          example: 60
        redirectUri:
          type: string
          example: burnly://auth/callback
        state:
          type: string
      required:
        - code
        - expiresIn
        - redirectUri
        - state
    DesktopHandoffEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DesktopHandoffDataDto"
      required:
        - data
    DesktopTokenRequestDto:
      type: object
      properties:
        code:
          type: string
          description: One-time code from web redirect.
        codeVerifier:
          type: string
          description: PKCE code_verifier (43–128 chars).
        redirectUri:
          type: string
          example: burnly://auth/callback
        client:
          type: string
          enum:
            - desktop
          example: desktop
        deviceId:
          type: string
          description: Stable desktop install id (recommended).
        deviceName:
          type: string
      required:
        - code
        - codeVerifier
        - redirectUri
        - client
    MeSessionDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        deviceId:
          type: string
          example: device-a
          nullable: true
        deviceName:
          type: string
          example: iPhone 15
          nullable: true
        ip:
          type: string
          example: 203.0.113.10
          nullable: true
        userAgent:
          type: string
          example: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)
            AppleWebKit/605.1.15
          nullable: true
          maxLength: 512
        lastSeenAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
        createdAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
        expiresAt:
          type: string
          example: 2026-02-10T12:34:56.789Z
          format: date-time
        revokedAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
          nullable: true
        current:
          type: boolean
          example: true
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
          example: active
      required:
        - id
        - lastSeenAt
        - createdAt
        - expiresAt
        - current
        - status
    CursorPaginationMetaDto:
      type: object
      properties:
        limit:
          type: number
          example: 25
        hasMore:
          type: boolean
          example: true
        nextCursor:
          type: string
          example: eyJ2IjoxLCJzb3J0IjoiLWNyZWF0ZWRBdCIsImFmdGVyIjp7fX0
      required:
        - limit
        - hasMore
    MeSessionsListEnvelopeDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MeSessionDto"
        meta:
          $ref: "#/components/schemas/CursorPaginationMetaDto"
      required:
        - data
        - meta
    MePushTokenUpsertRequestDto:
      type: object
      properties:
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
            - WEB
          example: ANDROID
          description: Client platform where the push token was minted.
        token:
          type: string
          example: <fcm-registration-token>
          maxLength: 2048
          description: FCM registration token for this device/app install.
      required:
        - platform
        - token
    MeEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MeDto"
      required:
        - data
    PatchMeProfileDto:
      type: object
      properties:
        displayName:
          type: string
          example: Dante
          nullable: true
          minLength: 1
          maxLength: 100
        givenName:
          type: string
          example: Dante
          nullable: true
          minLength: 1
          maxLength: 100
        familyName:
          type: string
          example: Alighieri
          nullable: true
          minLength: 1
          maxLength: 100
    PatchMeRequestDto:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/PatchMeProfileDto"
      required:
        - profile
    CreateProfileImageUploadRequestDto:
      type: object
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          example: image/webp
          description: Declared MIME type for the upload. Must match the Content-Type used
            during upload.
        sizeBytes:
          type: number
          example: 123456
          minimum: 1
          maximum: 5000000
          description: Declared size of the upload in bytes (used to verify the stored
            object).
      required:
        - contentType
        - sizeBytes
    PresignedUploadDto:
      type: object
      properties:
        method:
          type: string
          enum:
            - PUT
          example: PUT
        url:
          type: string
          example: https://<r2-presigned-url>
        headers:
          type: object
          example:
            Content-Type: image/webp
          description: Headers that must be sent with the upload request.
      required:
        - method
        - url
        - headers
    ProfileImageUploadPlanDto:
      type: object
      properties:
        fileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        upload:
          $ref: "#/components/schemas/PresignedUploadDto"
        expiresAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
      required:
        - fileId
        - upload
        - expiresAt
    ProfileImageUploadPlanEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProfileImageUploadPlanDto"
      required:
        - data
    CompleteProfileImageUploadRequestDto:
      type: object
      properties:
        fileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
      required:
        - fileId
    ProfileImageUrlDto:
      type: object
      properties:
        url:
          type: string
          example: https://<r2-presigned-url>
        expiresAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
      required:
        - url
        - expiresAt
    ProfileImageUrlEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProfileImageUrlDto"
      required:
        - data
    UpsertSyncDeviceRequestDto:
      type: object
      properties:
        displayName:
          type: string
          example: fikri-laptop
          nullable: true
          description: Optional human label (hostname or user-editable name).
        platform:
          type: string
          enum: &a10
            - linux
            - macos
            - windows
          example: linux
        appVersion:
          type: string
          example: 0.1.20
        reportingTimezone:
          type: string
          example: Asia/Jakarta
          description: IANA reporting timezone from the desktop install.
      required:
        - platform
        - appVersion
        - reportingTimezone
    SyncDeviceDto:
      type: object
      properties:
        clientDeviceId:
          type: string
          example: dev_abc123
        displayName:
          type: string
          example: fikri-laptop
          nullable: true
        platform:
          type: string
          enum: *a10
          example: linux
        appVersion:
          type: string
          example: 0.1.20
        reportingTimezone:
          type: string
          example: Asia/Jakarta
        lastSyncAt:
          type: string
          example: 2026-07-09T12:00:00.000Z
          nullable: true
          description: Last successful daily-usage accept time, if any.
        createdAt:
          type: string
          example: 2026-07-09T10:00:00.000Z
        updatedAt:
          type: string
          example: 2026-07-09T10:00:00.000Z
      required:
        - clientDeviceId
        - platform
        - appVersion
        - reportingTimezone
        - createdAt
        - updatedAt
    SyncDeviceEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SyncDeviceDto"
      required:
        - data
    SyncUsageWindowDto:
      type: object
      properties:
        startDate:
          type: string
          example: 2026-07-08
        endDate:
          type: string
          example: 2026-07-08
        scope:
          type: string
          enum:
            - full
            - incremental
            - rolling
          example: incremental
          description: full = first baseline / full-history export generation (may be
            split across requests). incremental = later uploads for a refresh
            range / successful sources. rolling = deprecated; accepted for
            compatibility — prefer full or incremental. Neither full nor
            incremental implies server-side deletion of absent facts; removals
            require explicit recordState "removed".
      required:
        - startDate
        - endDate
        - scope
    PushDailyUsageRequestDto:
      type: object
      properties:
        contractVersion:
          type: number
          example: 1
        clientDeviceId:
          type: string
          example: example-device-1
        appVersion:
          type: string
          example: 0.1.20
        reportingTimezone:
          type: string
          example: UTC
        clientRevision:
          type: number
          example: 1
          minimum: 1
        window:
          $ref: "#/components/schemas/SyncUsageWindowDto"
        facts:
          type: array
          items:
            type: object
            additionalProperties: true
          maxItems: 1000
          description: Daily usage facts; deep validation in service. Over-limit returns
            SYNC_PAYLOAD_TOO_LARGE.
      required:
        - contractVersion
        - clientDeviceId
        - appVersion
        - reportingTimezone
        - clientRevision
        - window
        - facts
    PushDailyUsageCountsDto:
      type: object
      properties:
        received:
          type: number
          example: 1
        upserted:
          type: number
          example: 1
        removed:
          type: number
          example: 0
        unchanged:
          type: number
          example: 0
        rejected:
          type: number
          example: 0
      required:
        - received
        - upserted
        - removed
        - unchanged
        - rejected
    PushDailyUsageResultDto:
      type: object
      properties:
        clientDeviceId:
          type: string
        acceptedAt:
          type: string
          example: 2026-07-09T12:00:00.000Z
        clientRevision:
          type: number
          example: 1
        window:
          $ref: "#/components/schemas/SyncUsageWindowDto"
        counts:
          $ref: "#/components/schemas/PushDailyUsageCountsDto"
      required:
        - clientDeviceId
        - acceptedAt
        - clientRevision
        - window
        - counts
    PushDailyUsageEnvelopeDto:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PushDailyUsageResultDto"
      required:
        - data
    SyncStatusDeviceDto:
      type: object
      properties:
        clientDeviceId:
          type: string
          example: dev_abc123
        displayName:
          type: string
          nullable: true
          example: fikri-laptop
        platform:
          type: string
          enum:
            - linux
            - macos
            - windows
          example: linux
        appVersion:
          type: string
          example: 0.1.20
        reportingTimezone:
          type: string
          example: Asia/Jakarta
        lastSyncAt:
          type: string
          nullable: true
          example: 2026-07-15T03:55:00.000Z
