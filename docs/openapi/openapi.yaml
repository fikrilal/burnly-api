openapi: 3.0.0
paths:
  /health:
    get:
      description: Indicates whether the process is alive.
      operationId: health.get
      parameters: []
      responses:
        "200":
          description: Liveness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      summary: Liveness check
      tags:
        - Health
      x-error-codes:
        - INTERNAL
  /ready:
    get:
      description: Indicates whether the service is ready to receive traffic.
      operationId: ready.get
      parameters: []
      responses:
        "200":
          description: Readiness check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
      summary: Readiness check
      tags:
        - Health
      x-error-codes:
        - INTERNAL
  /v1/auth/password/register:
    post:
      description: Creates a user and immediately issues first-party access + refresh
        tokens.
      operationId: auth.password.register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRegisterRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Register (password)
      tags: &a1
        - Auth
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_EMAIL_ALREADY_EXISTS
        - INTERNAL
  /v1/auth/oidc/exchange:
    post:
      description: Verifies an OIDC id_token (e.g., Google) and issues first-party
        access + refresh tokens. Does not auto-link to an existing password
        account purely by email.
      operationId: auth.oidc.exchange
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Exchange OIDC id_token
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_LINK_REQUIRED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/oidc/connect:
    post:
      description: Links an OIDC identity (e.g., Google) to the authenticated user. If
        the OIDC email matches the user email, the user email is marked
        verified.
      operationId: auth.oidc.connect
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcConnectRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Connect OIDC identity (current user)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - AUTH_OIDC_NOT_CONFIGURED
        - AUTH_OIDC_TOKEN_INVALID
        - AUTH_OIDC_EMAIL_NOT_VERIFIED
        - AUTH_OIDC_IDENTITY_ALREADY_LINKED
        - AUTH_OIDC_PROVIDER_ALREADY_LINKED
        - INTERNAL
  /v1/auth/email/verify:
    post:
      description: Verifies a user email using a token sent via email.
      operationId: auth.email.verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequestDto"
      responses:
        "204":
          description: ""
      summary: Verify email
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_EMAIL_VERIFICATION_TOKEN_INVALID
        - AUTH_EMAIL_VERIFICATION_TOKEN_EXPIRED
        - INTERNAL
  /v1/auth/email/verification/resend:
    post:
      description: Enqueues a new verification email for the authenticated user (rate
        limited).
      operationId: auth.email.verification.resend
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Resend verification email (current user)
      tags: *a1
      x-error-codes:
        - UNAUTHORIZED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/reset/request:
    post:
      description: Enqueues a password reset email for an existing user. Returns 204
        even if the email is unknown to avoid account enumeration.
      operationId: auth.password.reset.request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDto"
      responses:
        "204":
          description: ""
      summary: Request password reset
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/reset/confirm:
    post:
      description: Resets the user password using a one-time token and revokes all sessions.
      operationId: auth.password.reset.confirm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequestDto"
      responses:
        "204":
          description: ""
      summary: Confirm password reset
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_PASSWORD_RESET_TOKEN_INVALID
        - AUTH_PASSWORD_RESET_TOKEN_EXPIRED
        - INTERNAL
  /v1/auth/password/login:
    post:
      description: Authenticates a user and issues first-party access + refresh tokens.
      operationId: auth.password.login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultWithMeEnvelopeDto"
      summary: Login (password)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_USER_SUSPENDED
        - RATE_LIMITED
        - INTERNAL
  /v1/auth/password/change:
    post:
      description: Changes the authenticated user password. Revokes other sessions
        (and their refresh tokens) but keeps the current session active.
      operationId: auth.password.change
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Change password (current user)
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - AUTH_PASSWORD_NOT_SET
        - AUTH_CURRENT_PASSWORD_INVALID
        - INTERNAL
  /v1/auth/refresh:
    post:
      description: Rotates the refresh token and returns a new access + refresh token.
      operationId: auth.refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResultEnvelopeDto"
      summary: Refresh tokens
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - AUTH_REFRESH_TOKEN_EXPIRED
        - AUTH_REFRESH_TOKEN_REUSED
        - AUTH_SESSION_REVOKED
        - AUTH_USER_SUSPENDED
        - INTERNAL
  /v1/auth/logout:
    post:
      description: Revokes the session associated with the provided refresh token.
      operationId: auth.logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequestDto"
      responses:
        "204":
          description: ""
      summary: Logout
      tags: *a1
      x-error-codes:
        - VALIDATION_FAILED
        - AUTH_REFRESH_TOKEN_INVALID
        - INTERNAL
  /.well-known/jwks.json:
    get:
      description: Publishes public keys used to verify access tokens.
      operationId: auth.jwks.get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                required:
                  - keys
      summary: JWKS
      tags:
        - Auth
      x-error-codes:
        - INTERNAL
  /v1/me/sessions:
    get:
      description: Lists all sessions (active, revoked, expired) for the authenticated
        user. Revoked sessions have refresh tokens revoked; access tokens remain
        valid until expiry.
      operationId: users.me.sessions.list
      parameters:
        - name: limit
          required: false
          in: query
          description: Max results to return (default 25, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from the previous response meta.nextCursor.
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: 'Comma-separated fields; prefix "-" for descending. Max 3 fields.
            Default: "-createdAt". Allowed: createdAt, id'
          schema:
            type: string
            example: -createdAt
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSessionsListEnvelopeDto"
      security:
        - access-token: []
      summary: List current user sessions
      tags: &a2
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - INTERNAL
  /v1/me/sessions/{sessionId}/revoke:
    post:
      description: Revokes the given session and its refresh tokens. Idempotent.
      operationId: users.me.sessions.revoke
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
            type: string
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Revoke a session (current user)
      tags: *a2
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - NOT_FOUND
        - INTERNAL
  /v1/me/push-token:
    put:
      description: Stores the FCM registration token for the current session.
        Idempotent; replaces any existing token for the session.
      operationId: users.me.pushToken.upsert
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePushTokenUpsertRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Register/update push token (current session)
      tags: &a3
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - AUTH_PUSH_NOT_CONFIGURED
        - INTERNAL
    delete:
      description: Clears the stored push token for the current session. Idempotent.
      operationId: users.me.pushToken.revoke
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Revoke push token (current session)
      tags: *a3
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /v1/me:
    get:
      description: Returns the authenticated user profile.
      operationId: users.me.get
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      security:
        - access-token: []
      summary: Get current user
      tags: &a4
        - Users
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
    patch:
      description: Partially updates the authenticated user profile. Omitted fields
        are unchanged; null clears a field.
      operationId: users.me.patch
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelopeDto"
      security:
        - access-token: []
      summary: Update current user profile
      tags: *a4
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/me/profile-image/upload:
    post:
      description: Creates an upload record and returns a short-lived presigned URL
        for direct upload to object storage.
      operationId: users.me.profileImage.upload
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileImageUploadRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUploadPlanEnvelopeDto"
      security:
        - access-token: []
      summary: Create a profile image upload plan (presigned URL)
      tags: &a5
        - Users
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - RATE_LIMITED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/profile-image/complete:
    post:
      description: Verifies the uploaded object and attaches it to the current user profile.
      operationId: users.me.profileImage.complete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileImageUploadRequestDto"
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Finalize a profile image upload
      tags: *a5
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - NOT_FOUND
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - USERS_PROFILE_IMAGE_NOT_UPLOADED
        - USERS_PROFILE_IMAGE_SIZE_MISMATCH
        - USERS_PROFILE_IMAGE_CONTENT_TYPE_MISMATCH
        - INTERNAL
  /v1/me/profile-image:
    delete:
      description: Detaches the current profile image (if any) and marks the stored
        file deleted. Object storage deletion is best-effort.
      operationId: users.me.profileImage.clear
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Clear current profile image
      tags: *a5
      x-error-codes:
        - UNAUTHORIZED
        - INTERNAL
  /v1/me/profile-image/url:
    get:
      description: Returns a short-lived presigned URL for rendering the current
        profile image. Returns 204 when no profile image is set.
      operationId: users.me.profileImage.url
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageUrlEnvelopeDto"
        "204":
          description: ""
      security:
        - access-token: []
      summary: Get current profile image URL
      tags: *a5
      x-error-codes:
        - UNAUTHORIZED
        - USERS_OBJECT_STORAGE_NOT_CONFIGURED
        - INTERNAL
  /v1/me/account-deletion/request:
    post:
      description: Schedules account deletion 30 days in the future. The account
        remains usable during the grace period and the request can be canceled.
        After the grace period, the account is de-identified (PII erased) and
        the email becomes reusable.
      operationId: users.me.accountDeletion.request
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Request account deletion (30-day grace)
      tags: &a6
        - Users
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
  /v1/me/account-deletion/cancel:
    post:
      description: Cancels a previously scheduled account deletion request.
      operationId: users.me.accountDeletion.cancel
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      responses:
        "204":
          description: ""
      security:
        - access-token: []
      summary: Cancel account deletion
      tags: *a6
      x-error-codes:
        - UNAUTHORIZED
        - IDEMPOTENCY_IN_PROGRESS
        - INTERNAL
  /v1/sync/devices/{clientDeviceId}:
    put:
      description: Upserts this desktop install as a sync device for the authenticated
        user. Safe to call repeatedly.
      operationId: sync.devices.upsert
      parameters:
        - name: clientDeviceId
          required: true
          in: path
          description: Stable per-install client device id (max 128 chars).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSyncDeviceRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDeviceEnvelopeDto"
      security:
        - access-token: []
      summary: Register or update a sync device
      tags: &a7
        - Sync
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - INTERNAL
    get:
      description: Returns this install’s sync device metadata for the authenticated
        user, including lastSyncAt when available.
      operationId: sync.devices.get
      parameters:
        - name: clientDeviceId
          required: true
          in: path
          description: Stable per-install client device id (max 128 chars).
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDeviceEnvelopeDto"
      security:
        - access-token: []
      summary: Get sync device metadata
      tags: *a7
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - SYNC_DEVICE_NOT_FOUND
        - INTERNAL
  /v1/sync/daily-usage:
    post:
      description: "Uploads a batch of daily usage aggregates for a registered sync
        device. Requires Idempotency-Key. All-or-nothing validation; does not
        create devices. Limits: 1000 facts/request, 100 models/fact, 60
        pushes/15 min per user."
      operationId: sync.dailyUsage.push
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Idempotency key for safe retries of write requests. Replays return
            `Idempotency-Replayed: true`."
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            description: "Opaque string (recommended: UUIDv4)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDailyUsageRequestDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDailyUsageEnvelopeDto"
      security:
        - access-token: []
      summary: Push daily usage facts
      tags:
        - Sync
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - RATE_LIMITED
        - SYNC_CONTRACT_UNSUPPORTED
        - SYNC_DEVICE_NOT_FOUND
        - SYNC_IDENTITY_INVALID
        - SYNC_PAYLOAD_TOO_LARGE
        - IDEMPOTENCY_IN_PROGRESS
        - CONFLICT
        - INTERNAL
info:
  title: Burnly API
  description: Generated API contract (code-first).
  version: 0.1.0
  contact: {}
tags:
  - name: Health
    description: Service health and readiness endpoints.
  - name: Auth
    description: Authentication and session endpoints.
  - name: Users
    description: User profile endpoints.
  - name: Sync
    description: "Desktop collect: device registration and usage push."
servers:
  - url: /
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: "First-party access token (Authorization: Bearer <token>)"
  schemas:
    PasswordRegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          minLength: 10
        deviceId:
          type: string
          description: Stable per-device identifier (recommended).
        deviceName:
          type: string
          description: Human-friendly device name (optional).
      required:
        - email
        - password
    MeProfileDto:
      type: object
      properties:
        profileImageFileId:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
          nullable: true
          description: Current profile image stored file ID. Use `GET
            /v1/me/profile-image/url` to get a short-lived URL for rendering.
        displayName:
          type: string
          example: Dante
          nullable: true
        givenName:
          type: string
          example: Dante
          nullable: true
        familyName:
          type: string
          example: Alighieri
          nullable: true
    AccountDeletionDto:
      type: object
      properties:
        requestedAt:
          type: string
          example: 2026-01-10T12:34:56.789Z
          format: date-time
        scheduledFor:
          type: string
          example: 2026-02-09T12:34:56.789Z
          format: date-time
      required:
        - requestedAt
        - scheduledFor
    MeDto:
      type: object
      properties:
        id:
          type: string
          example: 3d2c7b2a-2dd6-46a5-8f8e-3b5de8a5b0f0
        email:
          type: string
          example: user@example.com
        emailVerified:
          type: boolean
          example: false
        roles:
          example:
            - USER
          type: array
          items:
            type: string
        authMethods:
          type: array
          example:
            - PASSWORD
          description: Linked authentication methods on this account.
          items:
            type: string
            enum: &a9
              - PASSWORD
              - GOOGLE
        profile:
          $ref: "#/components/schemas/MeProfileDto"
        accountDeletion:
          nullable: true
          description: When set, the account is scheduled for deletion. The request can be
